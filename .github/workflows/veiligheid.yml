name: Veiligheidstest
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test (XSS, CSP, MSAL-hash)
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          node veiligheid.mjs
