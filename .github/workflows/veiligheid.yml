name: Veiligheidstest
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]          # actieve LTS-versies (Node 20 is sinds april 2026 niet meer ondersteund)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Test (XSS, CSP, MSAL-hash)
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          node veiligheid.mjs
